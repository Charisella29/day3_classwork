services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nimcuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: nimcdb
      volumes: 
        - ./database/db-init.sql:/docker-entrypoint-initdb.d/init.sql
      port:
        - "5432:5432"
    # backend section
  backend:
    build: ./backend
    environmen:
    POSTGREDS_USER: nimcuser
    POSTGRES_PASSWORD: mypassword
    POSTGRES_DB: nimcdb
    POSTGRES_HOST: db
    ports:
    - "5000:5000"
    -depeends_on:
    - db
  # Frontend section
  frontend:
    build: ./Frontend
    ports:
        - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:5000
    depend_on:
      - backendv5
